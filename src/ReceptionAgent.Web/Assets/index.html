<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>受付のご案内</title><link rel="stylesheet" href="/kiosk.css"><script src="/kiosk.js" defer></script></head><body>
<header><span>受付のご案内</span><strong>職員テスト用</strong></header><main>
<section id="welcome"><p class="eyebrow">ようこそ</p><h1 id="welcome-title">マイナ受付</h1><p id="welcome-message">マイナンバーカードまたはスマートフォンをご用意ください。</p><button id="start" type="button" disabled>マイナ受付開始</button></section>
<section id="question" hidden><p class="eyebrow">受付の確認</p><h1 id="page-title"></h1><p id="page-message" class="message"></p><div id="page-controls"></div></section>
<section id="result" hidden><p class="eyebrow">受付のご案内</p><h1 id="title"></h1><p id="name" class="message" hidden></p><p id="message" class="message"></p><p id="progress"></p><button id="reset" type="button" hidden>表示を終了する</button></section>
<button id="cancel" type="button" hidden>受付を中止する</button><p id="error" role="alert"></p><footer>お名前が違う場合や操作にお困りの場合は、受付へお声掛けください。</footer></main></body></html>
