<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>受付のご案内</title><link rel="stylesheet" href="/kiosk.css"><script src="/kiosk.js" defer></script></head><body>
<header><span>Reception Kiosk</span><strong>職員テスト用・来院確認／連携は手動</strong></header>
<main><section id="input"><p class="eyebrow">受付をはじめる</p><h1>お名前と生年月日を<br>教えてください。</h1><p>入力後、カードリーダーの操作をご案内します。</p>
<form id="form" autocomplete="off"><label>氏名カナ<input id="kana" required maxlength="100" placeholder="ヤマダ ハナコ" autocomplete="off"></label><label>生年月日<input id="birth" type="date" required></label>
<label>これまでに当院を受診したことがありますか？<select id="visited"><option value="">選択してください</option><option value="yes">あります</option><option value="no">初めてです</option></select></label>
<label>診察券番号（わかる場合）<input id="patient" inputmode="numeric" maxlength="50" pattern="[0-9]*"></label><button id="start" type="submit">受付を開始する</button></form></section>
<section id="result" hidden><p class="eyebrow">受付のご案内</p><h1 id="title"></h1><p id="message" class="message"></p><p id="progress"></p><button id="cancel">受付を中止する</button><button id="reset" hidden>表示を終了する</button></section>
<p id="error" role="alert"></p><footer>この画面では受付完了の操作は行いません。職員の案内に従ってください。</footer></main></body></html>
