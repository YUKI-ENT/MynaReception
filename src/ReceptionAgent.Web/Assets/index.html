<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>受付のご案内</title><link rel="stylesheet" href="/kiosk.css"><script src="/kiosk.js" defer></script></head><body>
<header><span>受付のご案内</span><strong>職員テスト用</strong></header><main>
<section id="welcome"><p class="eyebrow">ようこそ</p><h1>受付をはじめます。</h1><p>はじめに顔認証カードリーダーで資格確認を行います。</p><button id="start" type="button">受付を開始する</button></section>
<section id="card" hidden><p class="eyebrow">1. 資格確認</p><h1>カードリーダーを<br>操作してください。</h1><p>画面の案内に従って資格確認を済ませてから、次へお進みください。</p><button id="card-done" type="button">資格確認が終わりました・次へ</button></section>
<section id="input" hidden><p class="eyebrow">2. 確認事項</p><h1>3つの項目に<br>お答えください。</h1><p>入力中に患者情報・予約を確認しています。</p><form id="form" autocomplete="off">
<fieldset><legend>お誕生日（月・日）</legend><div class="birthday"><label>月<select id="month" required><option value="">月</option></select></label><label>日<select id="day" required><option value="">日</option></select></label></div></fieldset>
<fieldset><legend>発熱はありますか？</legend><div class="choices"><label><input type="radio" name="fever" value="yes" required>あります</label><label><input type="radio" name="fever" value="no" required>ありません</label></div></fieldset>
<fieldset><legend>本日の予約はありますか？</legend><div class="choices"><label><input type="radio" name="reserved" value="yes" required>あります</label><label><input type="radio" name="reserved" value="no" required>ありません</label></div></fieldset>
<button id="submit" type="submit">回答を送信する</button></form></section>
<section id="result" hidden><p class="eyebrow">受付のご案内</p><h1 id="title"></h1><p id="name" class="message" hidden></p><p id="message" class="message"></p><p id="progress"></p><button id="reset" hidden>表示を終了する</button></section>
<button id="cancel" type="button" hidden>受付を中止する</button><p id="error" role="alert"></p><footer>お名前が違う場合や操作にお困りの場合は、受付へお声掛けください。</footer></main></body></html>
